services:
  - type: web
    name: soundabode-backend-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: ASHU_PASSCODE
        sync: false
      - key: VAIBHAV_PASSCODE
        sync: false
      - key: CORS_ORIGIN
        value: https://soundabode.com,https://www.soundabode.com
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: services@soundabode.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: Soundabode Studios
      - key: SMTP_FROM_EMAIL
        value: services@soundabode.com
      - key: DEVELOPER_TARGET_EMAIL
        value: devangdhakate22@gmail.com
