    <script>
      // Auto-recover from stale JS module cache or missing chunk errors across deployments
      (function() {
        function triggerHardReload() {
          var key = 'sa_chunk_reload_ts';
          var last = parseInt(sessionStorage.getItem(key) || '0', 10);
          var now = Date.now();
          if (now - last > 5000) {
            sessionStorage.setItem(key, now.toString());
            try {
              if (window.caches && caches.keys) {
                caches.keys().then(function(names) {
                  names.forEach(function(n) { caches.delete(n); });
                });
              }
            } catch (err) {}
            // Force bypass of local cache on reload
            window.location.reload();
          }
        }

        window.addEventListener('vite:preloadError', function (e) {
          if (e) e.preventDefault();
          triggerHardReload();
        });

        window.addEventListener('error', function (e) {
          var target = e.target;
          var msg = (e.message || '').toLowerCase();
          var isChunkErr = msg.includes('failed to load module script') ||
                           msg.includes('mime type') ||
                           msg.includes('loading chunk') ||
                           msg.includes('dynamically imported module') ||
                           msg.includes('failed to fetch');
          var isScriptTag = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          if (isChunkErr || isScriptTag) {
            triggerHardReload();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = (e.reason && (e.reason.message || e.reason.toString())) || '';
          var lower = reason.toLowerCase();
          if (lower.includes('dynamically imported module') ||
              lower.includes('failed to fetch') ||
              lower.includes('loading chunk') ||
              lower.includes('failed to load module script')) {
            triggerHardReload();
          }
        });
      })();
    </script>
